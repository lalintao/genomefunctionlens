[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-database-deel-pipeline"
version = "1.1.0"
description = "Data organization pipeline for protein annotation, trees, matrices, and SQLite outputs."
requires-python = ">=3.11"
dependencies = [
  "biopython>=1.84",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "tqdm>=4.66",
]

[project.scripts]
webdb-pipeline = "webdb_pipeline.cli:main"
webdb-gtdb-taxonomy = "webdb_pipeline.gtdb_taxonomy_metadata:main"
webdb-runtime-tree-upgrade = "webdb_pipeline.runtime_tree_upgrade:main"
webdb-runtime-index-upgrade = "webdb_pipeline.runtime_indexes:main"
webdb-row-data-audit = "webdb_pipeline.row_data_audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
